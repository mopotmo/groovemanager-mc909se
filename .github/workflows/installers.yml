# Builds the native installers with jpackage on each platform. On a tag
# v<version> they are attached to the GitHub release of that tag; a manual run
# only uploads them as workflow artifacts.
#
# The Windows installer upgrades an installed version with the same upgrade
# UUID (see build.gradle.kts) if its version is higher. Installing the same
# version from a different build fails, so give test builds their own version.
name: Installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a test build. The Windows installer only replaces an installed version with a lower number."
        default: "1.1.0"

permissions:
  contents: write

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: windows-latest
            platform: windows-x64
          - runner: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Install WiX (needed by jpackage for the msi)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installer
        shell: bash
        run: ./gradlew jpackage -PappVersion=${{ steps.version.outputs.version }}

      # no version in the names, so that releases/latest/download/<name>
      # links (e.g. on groovemanager.com) keep working for new releases
      - name: Rename for the platform
        shell: bash
        run: |
          mkdir dist
          for f in build/jpackage/output/*; do
            mv "$f" "dist/groovemanager-mc909se-${{ matrix.platform }}.${f##*.}"
          done
          ls -l dist

      - uses: actions/upload-artifact@v5
        with:
          name: installer-${{ matrix.platform }}
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
